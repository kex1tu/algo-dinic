<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="284" viewBox="0 0 1040 284" role="img">
<title>Число проверок на двухдуговом пути</title>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1040" height="284" fill="#FFFFFF"/>
<path d="M 520 24 V 232" fill="none" stroke="#D5DFEB" stroke-width="1.5" stroke-linecap="round"/>
<text x="260" y="38" fill="#17263D" font-size="24" font-weight="700" text-anchor="middle">c1 ≤ c2</text>
<text x="260" y="63" fill="#475569" font-size="15" font-weight="400" text-anchor="middle">Вероятность 50,5%</text>
<path d="M 97.00 128.00 L 226.40 128.00" fill="none" stroke="#BE123C" stroke-width="2.8" stroke-linecap="round"/>
<path d="M 233.00 128.00 L 223.24 133.08 L 223.24 122.92 Z" fill="#BE123C"/>
<text x="165" y="112" fill="#BE123C" font-size="16" font-weight="700" text-anchor="middle">c1 = 2</text>
<path d="M 287.00 128.00 L 416.40 128.00" fill="none" stroke="#0369A1" stroke-width="2.8" stroke-linecap="round"/>
<path d="M 423.00 128.00 L 413.24 133.08 L 413.24 122.92 Z" fill="#0369A1"/>
<text x="355" y="112" fill="#0369A1" font-size="16" font-weight="700" text-anchor="middle">c2 = 3</text>
<circle cx="70" cy="128" r="23" fill="#0369A1"/>
<text x="70" y="135" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">s</text>
<circle cx="260" cy="128" r="23" fill="#17263D"/>
<text x="260" y="135" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">a</text>
<circle cx="450" cy="128" r="23" fill="#6D28D9"/>
<text x="450" y="135" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">t</text>
<text x="260" y="196" fill="#17263D" font-size="23" font-weight="700" text-anchor="middle">9 проверок</text>
<text x="260" y="225" fill="#475569" font-size="15" font-weight="400" text-anchor="middle">Первый BFS: 4  ·  DFS: 4  ·  Заключительный BFS: 1</text>
<text x="780" y="38" fill="#17263D" font-size="24" font-weight="700" text-anchor="middle">c1 &gt; c2</text>
<text x="780" y="63" fill="#475569" font-size="15" font-weight="400" text-anchor="middle">Вероятность 49,5%</text>
<path d="M 617.00 128.00 L 746.40 128.00" fill="none" stroke="#B45309" stroke-width="2.8" stroke-linecap="round"/>
<path d="M 753.00 128.00 L 743.24 133.08 L 743.24 122.92 Z" fill="#B45309"/>
<text x="685" y="112" fill="#B45309" font-size="16" font-weight="700" text-anchor="middle">c1 = 3</text>
<path d="M 807.00 128.00 L 936.40 128.00" fill="none" stroke="#BE123C" stroke-width="2.8" stroke-linecap="round"/>
<path d="M 943.00 128.00 L 933.24 133.08 L 933.24 122.92 Z" fill="#BE123C"/>
<text x="875" y="112" fill="#BE123C" font-size="16" font-weight="700" text-anchor="middle">c2 = 2</text>
<circle cx="590" cy="128" r="23" fill="#0369A1"/>
<text x="590" y="135" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">s</text>
<circle cx="780" cy="128" r="23" fill="#17263D"/>
<text x="780" y="135" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">a</text>
<circle cx="970" cy="128" r="23" fill="#6D28D9"/>
<text x="970" y="135" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">t</text>
<text x="780" y="196" fill="#17263D" font-size="23" font-weight="700" text-anchor="middle">12 проверок</text>
<text x="780" y="225" fill="#475569" font-size="15" font-weight="400" text-anchor="middle">Первый BFS: 4  ·  DFS: 5  ·  Заключительный BFS: 3</text>
<text x="520" y="267" fill="#475569" font-size="15" font-weight="400" text-anchor="middle">Ёмкости c1 и c2 независимо выбираются из целых чисел от 1 до 100.</text>
</g>
</svg>
