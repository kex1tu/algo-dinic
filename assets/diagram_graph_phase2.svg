<svg xmlns="http://www.w3.org/2000/svg" width="980" height="262" viewBox="0 0 980 262" role="img">
<title>После второй фазы</title>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect width="980" height="262" fill="#FFFFFF"/>
<text x="30" y="38" fill="#17263D" font-size="24" font-weight="700" text-anchor="start">После второй фазы</text>
<text x="950" y="38" fill="#475569" font-size="15" font-weight="400" text-anchor="end">Поток / пропускная способность</text>
<path d="M 240 108 V 205" fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="240" y="95" fill="#047857" font-size="16" font-weight="700" text-anchor="middle">Разрез {s}</text>
<path d="M 142.00 158.00 L 331.40 158.00" fill="none" stroke="#BE123C" stroke-width="2.8" stroke-linecap="round"/>
<path d="M 338.00 158.00 L 328.24 163.08 L 328.24 152.92 Z" fill="#BE123C"/>
<text x="277" y="185" fill="#BE123C" font-size="17" font-weight="700" text-anchor="middle">3 / 3</text>
<path d="M 388.80 145.24 Q 615.00 24.00 835.39 142.13" fill="none" stroke="#BE123C" stroke-width="2.8" stroke-linecap="round"/>
<path d="M 841.20 145.24 L 830.20 145.11 L 835.00 136.16 Z" fill="#BE123C"/>
<text x="615" y="75" fill="#BE123C" font-size="17" font-weight="700" text-anchor="middle">2 / 2</text>
<path d="M 392.00 158.00 L 581.40 158.00" fill="none" stroke="#BE123C" stroke-width="2.8" stroke-linecap="round"/>
<path d="M 588.00 158.00 L 578.24 163.08 L 578.24 152.92 Z" fill="#BE123C"/>
<text x="490" y="141" fill="#BE123C" font-size="17" font-weight="700" text-anchor="middle">1 / 1</text>
<path d="M 642.00 158.00 L 831.40 158.00" fill="none" stroke="#BE123C" stroke-width="2.8" stroke-linecap="round"/>
<path d="M 838.00 158.00 L 828.24 163.08 L 828.24 152.92 Z" fill="#BE123C"/>
<text x="740" y="141" fill="#BE123C" font-size="17" font-weight="700" text-anchor="middle">1 / 1</text>
<circle cx="115" cy="158" r="23" fill="#047857"/>
<text x="115" y="165" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">s</text>
<circle cx="365" cy="158" r="23" fill="#17263D"/>
<text x="365" y="165" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">a</text>
<circle cx="615" cy="158" r="23" fill="#17263D"/>
<text x="615" y="165" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">b</text>
<circle cx="865" cy="158" r="23" fill="#6D28D9"/>
<text x="865" y="165" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">t</text>
<text x="490" y="218" fill="#17263D" font-size="16" font-weight="400" text-anchor="middle">По пути s → a → b → t прошла ещё 1 единица.</text>
<text x="490" y="245" fill="#047857" font-size="16" font-weight="700" text-anchor="middle">В заключительном BFS достижим только s. Максимальный поток и ёмкость разреза равны 3.</text>
</g>
</svg>
