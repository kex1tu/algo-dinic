<circle cx="115" cy="158" r="23" fill="#0369A1"/>
<text x="115" y="165" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">s</text>
<circle cx="365" cy="158" r="23" fill="#17263D"/>
<text x="365" y="165" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">a</text>
<circle cx="615" cy="158" r="23" fill="#17263D"/>
<text x="615" y="165" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">b</text>
<circle cx="865" cy="158" r="23" fill="#6D28D9"/>
<text x="865" y="165" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">t</text>
<text x="115" y="208" fill="#475569" font-size="15" font-weight="400" text-anchor="middle">d = 0</text>
<text x="365" y="208" fill="#475569" font-size="15" font-weight="400" text-anchor="middle">d = 1</text>
<text x="615" y="208" fill="#475569" font-size="15" font-weight="400" text-anchor="middle">d = 2</text>
<text x="865" y="208" fill="#475569" font-size="15" font-weight="400" text-anchor="middle">d = 2</text>
<text x="490" y="242" fill="#17263D" font-size="16" font-weight="400" text-anchor="middle">Уровни до проталкивания. По пути s → a → t прошло 2 единицы.</text>
